<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Contato - Contador</title>
</head>
<body>

    <main class="container">
        <h1>FALE CONOSCO</h1>
        <p class="subtitulo">TIRE SUAS DÚVIDAS SOBRE OS INGRESSOS E JOGOS</p>

        <form action="#" method="POST">
            <label for="nome">NOME</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-MAIL</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="assunto">ASSUNTO</label>
            <input type="text" id="assunto" placeholder="Digite o assunto" required>

            <label for="mensagem">MENSAGEM</label>
            <textarea id="mensagem" rows="4" placeholder="Escreva sua mensagem" required></textarea>

            <button type="submit">ENVIAR</button>
        </form>

        <div class="info-box">
            <h3>OUTRAS FORMAS DE CONTATO</h3>
            <p><strong>E-mail:</strong> contato@manchaverde.com.br</p>
            <p><strong>Telefone:</strong> (11) 99999-9999</p>
            <p><strong>Endereço:</strong> Rua Palestra Itália, 214 - São Paulo/SP</p>
        </div>

        <div class="redes-sociais">
            <h3>SIGA NAS REDES</h3>
            <div class="icones">
                <a href="https://www.instagram.com/palmeiras/?hl=pt-br" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/Palmeiras/?locale=pt_BR" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://x.com/Palmeiras" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>

        <div class="mapa-box">
            <h3>LOCALIZAÇÃO</h3>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.834789547087!2d-46.6787883!3d-23.5293674!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5784f1b4d081%3A0xb3caefda9d17d59b!2sAllianz%20Parque!5e0!3m2!1spt-BR!2sbr" 
                width="100%" 
                height="200" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </main>

    <footer class="rodape-moderno">
        <div class="rodape-links">
        <a href="../../index.html">PÁGINA INICIAL</a>

</html>
